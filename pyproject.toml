[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ydl"
version = "1.3.0"
description = "A resumable YouTube-to-MP3 downloader for the Linux terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
tui = ["textual>=8.2.8,<8.3"]

[project.urls]
Source = "https://github.com/stef-k/ydl"
Issues = "https://github.com/stef-k/ydl/issues"

[project.scripts]
ydl = "ydl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ydl = ["*.tcss"]
