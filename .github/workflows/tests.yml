name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.installation }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        installation: [base, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Test the base installation
        if: matrix.installation == 'base'
        run: |
          python -m pip install .
          ydl --help
          ydl tui --help
          python -c "from importlib.util import find_spec; assert find_spec('textual') is None"
          cd tests
          python -m unittest -v test_backend test_cli test_entrypoint
      - name: Test the installed TUI extra
        if: matrix.installation == 'tui'
        run: |
          python -m pip install '.[tui]'
          ydl tui --help
          python -c "from importlib.resources import files; assert files('ydl').joinpath('tui.tcss').is_file()"
          python -m unittest discover -s tests -p 'test_tui*.py' -v
